name: Pack Resource Pack Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Zip Archive with Release Tag
        run: |
          zip -r "absolute.zip" assets nexo_26_2 pack.mcmeta pack.png

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: absolute.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}